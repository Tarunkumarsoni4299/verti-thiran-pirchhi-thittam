<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Virtual Chat</title>

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <!-- =====================================================
       CHAT WIDGET
  ====================================================== -->

  <div class="chat-card" id="chatWidget">

    <!-- ===================================================
         HEADER
    ==================================================== -->

    <div class="header">

      <div class="brand-container">

        <!-- Bot avatar -->
        <div class="brand-icon-box">

          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="
              M20 9V7c0-1.1-.9-2-2-2h-3
              c0-1.66-1.34-3-3-3S9 3.34 9 5H6
              c-1.1 0-2 .9-2 2v2
              c-1.66 0-3 1.34-3 3v3
              c0 1.66 1.34 3 3 3v2
              c0 1.1.9 2 2 2h12
              c1.1 0 2-.9 2-2v-2
              c1.66 0 3-1.34 3-3v-3
              c0-1.66-1.34-3-3-3zm-2 10H6V7h12v12z">
            </path>
          </svg>

        </div>

        <!-- Title -->
        <div class="brand-text-block">

          <div class="brand-header-line">
            <span class="brand-title">Virtual Chat</span>
          </div>

          <span class="brand-subtitle">
            Intelligent Personalized Learning Assistant
          </span>

        </div>

      </div>


      <!-- Close button -->

      <button
        class="close-btn"
        type="button"
        onclick="closeChat()"
        aria-label="Close chat">

        &times;

      </button>

    </div>


    <!-- ===================================================
         MODE TABS
         
         Hidden by CSS to match the screenshot.
         They are still available for your JavaScript.
    ==================================================== -->

    <div class="tabs">

      <button
        class="tab-btn active"
        type="button"
        onclick="setMode('Concept Explainer', this)">
        Concept Explainer
      </button>

      <button
        class="tab-btn"
        type="button"
        onclick="setMode('Instant Q&A', this)">
        Instant Q&A
      </button>

      <button
        class="tab-btn"
        type="button"
        onclick="setMode('Summaries & Notes', this)">
        Summaries & Notes
      </button>

      <button
        class="tab-btn"
        type="button"
        onclick="setMode('Interactive Quizzes', this)">
        Interactive Quizzes
      </button>

    </div>


    <!-- ===================================================
         CHAT MESSAGES
    ==================================================== -->

    <div
      class="chat-messages"
      id="chatContainer">

      <!-- Initial AI message -->

      <div class="message-row ai">

        <!-- AI Avatar -->

        <div class="avatar avatar-ai">

          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="
              M20 9V7c0-1.1-.9-2-2-2h-3
              c0-1.66-1.34-3-3-3S9 3.34 9 5H6
              c-1.1 0-2 .9-2 2v2
              c-1.66 0-3 1.34-3 3v3
              c0 1.66 1.34 3 3 3v2
              c0 1.1.9 2 2 2h12
              c1.1 0 2-.9 2-2v-2
              c1.66 0 3-1.34 3-3v-3
              c0-1.66-0.9-3-3-3zm-2 10H6V7h12v12z">
            </path>
          </svg>

        </div>


        <!-- Message -->

        <div class="bubble">
          Hello! My name is VirtuBot. I am a virtual assistant
          representing Nazar. You can ask me questions as if I am Nazar.
        </div>


        <!-- Delete -->

        <button
          class="action-btn"
          type="button"
          title="Delete message"
          onclick="deleteMessage(this)">

          🗑️

        </button>

      </div>


      <!-- =================================================
           Suggested question
      ================================================== -->

      <div class="suggestion">
        Tell me about yourself?
      </div>


    </div>


    <!-- ===================================================
         INPUT AREA
    ==================================================== -->

    <div class="chat-input-area">

      <textarea
        id="promptInput"
        placeholder="Ask me something..."
        rows="3"
        onkeydown="handleKeyPress(event)"
        aria-label="Ask a question"></textarea>


      <!-- Send button -->

      <button
        class="send-btn"
        id="sendBtn"
        type="button"
        onclick="sendMessage()"
        title="Send Message"
        aria-label="Send Message">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="
            M2.01 21L23 12 2.01 3 2 10l15 2-15 2z">
          </path>
        </svg>

      </button>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    /* =====================================================
       GLOBAL VARIABLES
    ====================================================== */

    let currentMode = "Concept Explainer";

    let isSending = false;

    let latestQuizData = null;


    /* =====================================================
       CLOSE CHAT
    ====================================================== */

    function closeChat() {

      const chatWidget =
        document.getElementById("chatWidget");

      if (chatWidget) {
        chatWidget.style.display = "none";
      }

    }


    /* =====================================================
       OPEN CHAT
       
       You can call openChat() from another button if needed.
    ====================================================== */

    function openChat() {

      const chatWidget =
        document.getElementById("chatWidget");

      if (chatWidget) {
        chatWidget.style.display = "flex";
      }

    }


    /* =====================================================
       SET MODE
    ====================================================== */

    function setMode(modeName, element) {

      currentMode = modeName;

      document
        .querySelectorAll(".tab-btn")
        .forEach(function(btn) {

          btn.classList.remove("active");

        });


      if (element) {
        element.classList.add("active");
      }


      appendMessage(
        "Switched mode to: **" + modeName + "**",
        "ai"
      );

    }


    /* =====================================================
       ENTER KEY
    ====================================================== */

    function handleKeyPress(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    /* =====================================================
       SEND MESSAGE
    ====================================================== */

    async function sendMessage() {

      if (isSending) {
        return;
      }


      const inputField =
        document.getElementById("promptInput");

      const chatContainer =
        document.getElementById("chatContainer");

      const sendBtn =
        document.getElementById("sendBtn");


      if (!inputField || !chatContainer) {
        return;
      }


      const text =
        inputField.value.trim();


      if (!text) {
        return;
      }


      /* Lock sending */

      isSending = true;


      if (sendBtn) {
        sendBtn.disabled = true;
      }


      /* Add user message */

      appendMessage(
        text,
        "user"
      );


      /* Clear input */

      inputField.value = "";


      /* =================================================
         LOADING MESSAGE
      ================================================== */

      const loadingDiv =
        document.createElement("div");

      loadingDiv.className =
        "message-row ai";

      loadingDiv.id =
        "loadingIndicator";


      loadingDiv.innerHTML = `

        <div class="avatar avatar-ai">

          <svg viewBox="0 0 24 24">

            <path d="
              M20 9V7c0-1.1-.9-2-2-2h-3
              c0-1.66-1.34-3-3-3S9 3.34 9 5H6
              c-1.1 0-2 .9-2 2v2
              c-1.66 0-3 1.34-3 3v3
              c0 1.66 1.34 3 3 3v2
              c0 1.1.9 2 2 2h12
              c1.1 0 2-.9 2-2v-2
              c1.66 0 3-1.34 3-3v-3
              c0-1.66-.9-3-3-3zm-2 10H6V7h12v12z">
            </path>

          </svg>

        </div>


        <div class="bubble typing-indicator">

          EduGenie is generating
          (${escapeHtml(currentMode)})...

        </div>

      `;


      chatContainer.appendChild(
        loadingDiv
      );


      chatContainer.scrollTop =
        chatContainer.scrollHeight;


      /* =================================================
         SERVER REQUEST
      ================================================== */

      try {

        const response =
          await fetch(
            "/api/qna",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                question: text,
                mode: currentMode
              })
            }
          );


        let data = {};

        try {

          data =
            await response.json();

        } catch (jsonError) {

          data = {};

        }


        /* Remove loading */

        const indicator =
          document.getElementById(
            "loadingIndicator"
          );

        if (indicator) {
          indicator.remove();
        }


        /* Server error */

        if (!response.ok) {

          appendMessage(
            data.error ||
            "Server error. Please try again.",
            "ai"
          );

          return;

        }


        const answerText =
          data.answer ||
          "No response received.";


        /* =================================================
           QUIZ MODE
        ================================================== */

        if (
          currentMode ===
          "Interactive Quizzes"
        ) {

          try {

            let cleaned =
              answerText
                .replace(
                  /```json/gi,
                  ""
                )
                .replace(
                  /```/g,
                  ""
                )
                .trim();


            const quizData =
              JSON.parse(cleaned);


            if (
              Array.isArray(quizData) &&
              quizData.length > 0
            ) {

              latestQuizData =
                quizData;

              renderQuiz(
                quizData
              );

            } else {

              appendMessage(
                answerText,
                "ai"
              );

            }

          } catch (quizError) {

            appendMessage(
              answerText,
              "ai"
            );

          }

        } else {

          /* Normal answer */

          appendMessage(
            answerText,
            "ai"
          );

        }

      } catch (error) {

        /* Remove loading */

        const indicator =
          document.getElementById(
            "loadingIndicator"
          );

        if (indicator) {
          indicator.remove();
        }


        appendMessage(
          "Error communicating with server. Is the backend running?",
          "ai"
        );

      } finally {

        isSending = false;


        if (sendBtn) {
          sendBtn.disabled = false;
        }


        if (inputField) {
          inputField.focus();
        }

      }

    }


    /* =====================================================
       APPEND MESSAGE
    ====================================================== */

    function appendMessage(
      text,
      sender
    ) {

      const chatContainer =
        document.getElementById(
          "chatContainer"
        );


      if (!chatContainer) {
        return;
      }


      const messageRow =
        document.createElement("div");

      messageRow.className =
        "message-row " +
        sender;


      /* =================================================
         AVATAR
      ================================================== */

      const avatar =
        document.createElement("div");

      avatar.className =
        "avatar " +
        (
          sender === "ai"
            ? "avatar-ai"
            : "avatar-user"
        );


      if (sender === "ai") {

        avatar.innerHTML = `

          <svg viewBox="0 0 24 24">

            <path d="
              M20 9V7c0-1.1-.9-2-2-2h-3
              c0-1.66-1.34-3-3-3S9 3.34 9 5H6
              c-1.1 0-2 .9-2 2v2
              c-1.66 0-3 1.34-3 3v3
              c0 1.66 1.34 3 3 3v2
              c0 1.1.9 2 2 2h12
              c1.1 0 2-.9 2-2v-2
              c1.66 0 3-1.34 3-3v-3
              c0-1.66-.9-3-3-3zm-2 10H6V7h12v12z">
            </path>

          </svg>

        `;

      } else {

        avatar.innerHTML = `

          <svg viewBox="0 0 24 24">

            <path d="
              M12 12c2.21 0 4-1.79
              4-4s-1.79-4-4-4
              -4 1.79-4 4
              1.79 4 4 4zm0 2
              c-2.67 0-8 1.34-8 4v2h16v-2
              c0-2.66-5.33-4-8-4z">
            </path>

          </svg>

        `;

      }


      /* =================================================
         MESSAGE BUBBLE
      ================================================== */

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";


      /*
        Escape HTML first so server responses
        cannot inject HTML into the page.

        Then support **bold** markdown.
      */

      bubble.innerHTML =
        escapeHtml(text)
          .replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
          );


      /* =================================================
         COPY BUTTON FOR AI
      ================================================== */

      if (sender === "ai") {

        const copyBtn =
          document.createElement("button");

        copyBtn.className =
          "copy-btn";

        copyBtn.innerHTML =
          "📋 Copy";

        copyBtn.onclick =
          function () {

            copyToClipboard(
              text,
              copyBtn
            );

          };


        bubble.appendChild(
          document.createElement("br")
        );


        bubble.appendChild(
          copyBtn
        );

      }


      /* =================================================
         DELETE BUTTON
      ================================================== */

      const deleteBtn =
        document.createElement("button");

      deleteBtn.className =
        "action-btn";

      deleteBtn.title =
        "Delete message";

      deleteBtn.type =
        "button";

      deleteBtn.innerHTML =
        "🗑️";


      deleteBtn.onclick =
        function () {

          deleteMessage(
            deleteBtn
          );

        };


      /* =================================================
         MESSAGE ORDER
      ================================================== */

      if (sender === "user") {

        messageRow.appendChild(
          deleteBtn
        );

        messageRow.appendChild(
          bubble
        );

        messageRow.appendChild(
          avatar
        );

      } else {

        messageRow.appendChild(
          avatar
        );

        messageRow.appendChild(
          bubble
        );

        messageRow.appendChild(
          deleteBtn
        );

      }


      chatContainer.appendChild(
        messageRow
      );


      /* Scroll to bottom */

      chatContainer.scrollTop =
        chatContainer.scrollHeight;

    }


    /* =====================================================
       DELETE MESSAGE
    ====================================================== */

    function deleteMessage(btn) {

      if (!btn) {
        return;
      }


      const row =
        btn.closest(
          ".message-row"
        );


      if (row) {
        row.remove();
      }

    }


    /* =====================================================
       COPY TO CLIPBOARD
    ====================================================== */

    function copyToClipboard(
      text,
      btnElement
    ) {

      if (
        !navigator.clipboard
      ) {
        return;
      }


      navigator.clipboard
        .writeText(text)
        .then(function () {

          if (!btnElement) {
            return;
          }


          const original =
            btnElement.innerHTML;


          btnElement.innerHTML =
            "✓ Copied!";


          setTimeout(
            function () {

              btnElement.innerHTML =
                original;

            },
            2000
          );

        })
        .catch(function () {

          /* Clipboard unavailable */

        });

    }


    /* =====================================================
       RENDER QUIZ
    ====================================================== */

    function renderQuiz(
      quizArray
    ) {

      const chatContainer =
        document.getElementById(
          "chatContainer"
        );


      if (
        !chatContainer ||
        !Array.isArray(quizArray)
      ) {
        return;
      }


      const messageRow =
        document.createElement("div");

      messageRow.className =
        "message-row ai";


      /* AI avatar */

      const avatar =
        document.createElement("div");

      avatar.className =
        "avatar avatar-ai";


      avatar.innerHTML = `

        <svg viewBox="0 0 24 24">

          <path d="
            M20 9V7c0-1.1-.9-2-2-2h-3
            c0-1.66-1.34-3-3-3S9 3.34 9 5H6
            c-1.1 0-2 .9-2 2v2
            c-1.66 0-3 1.34-3 3v3
            c0 1.66 1.34 3 3 3v2
            c0 1.1.9 2 2 2h12
            c1.1 0 2-.9 2-2v-2
            c1.66 0 3-1.34 3-3v-3
            c0-1.66-.9-3-3-3zm-2 10H6V7h12v12z">
          </path>

        </svg>

      `;


      /* Quiz bubble */

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";


      let quizHtml = `
        <div class="quiz-container">

          <b>📝 Interactive Quiz</b>
      `;


      quizArray.forEach(
        function (q, qIndex) {

          const options =
            Array.isArray(q.options)
              ? q.options
              : [];


          const optionsHtml =
            options
              .map(
                function (
                  opt,
                  oIndex
                ) {

                  return `

                    <div
                      class="quiz-option"
                      data-q="${qIndex}"
                      data-o="${oIndex}"
                      onclick="selectOption(${qIndex}, ${oIndex})">

                      ${escapeHtml(opt)}

                    </div>

                  `;

                }
              )
              .join("");


          quizHtml += `

            <div
              class="quiz-item"
              id="q-block-${qIndex}">

              <div class="quiz-q">

                ${qIndex + 1}.
                ${escapeHtml(
                  q.question || ""
                )}

              </div>


              <div class="quiz-options">

                ${optionsHtml}

              </div>


              <div
                class="quiz-explanation"
                id="exp-${qIndex}"
                style="display:none;">

                <b>Explanation:</b>

                ${escapeHtml(
                  q.explanation ||
                  "No explanation provided."
                )}

              </div>

            </div>

          `;

        }
      );


      quizHtml += `

          <button
            class="quiz-submit-btn"
            type="button"
            onclick="checkQuizAnswers()">

            Check Answers

          </button>

        </div>

      `;


      bubble.innerHTML =
        quizHtml;


      /* Copy quiz button */

      const copyBtn =
        document.createElement(
          "button"
        );


      copyBtn.className =
        "copy-btn";


      copyBtn.innerHTML =
        "📋 Copy Quiz";


      copyBtn.onclick =
        function () {

          copyToClipboard(
            bubble.innerText,
            copyBtn
          );

        };


      bubble.appendChild(
        document.createElement("br")
      );


      bubble.appendChild(
        copyBtn
      );


      /* Delete */

      const deleteBtn =
        document.createElement(
          "button"
        );


      deleteBtn.className =
        "action-btn";

      deleteBtn.type =
        "button";

      deleteBtn.title =
        "Delete message";

      deleteBtn.innerHTML =
        "🗑️";


      deleteBtn.onclick =
        function () {

          deleteMessage(
            deleteBtn
          );

        };


      /* Add to DOM */

      messageRow.appendChild(
        avatar
      );

      messageRow.appendChild(
        bubble
      );

      messageRow.appendChild(
        deleteBtn
      );


      chatContainer.appendChild(
        messageRow
      );


      chatContainer.scrollTop =
        chatContainer.scrollHeight;

    }


    /* =====================================================
       ESCAPE HTML
    ====================================================== */

    function escapeHtml(str) {

      if (
        typeof str !== "string"
      ) {
        return "";
      }


      return str
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       SELECT QUIZ OPTION
    ====================================================== */

    function selectOption(
      qIndex,
      oIndex
    ) {

      const qBlock =
        document.getElementById(
          `q-block-${qIndex}`
        );


      if (!qBlock) {
        return;
      }


      const options =
        qBlock.querySelectorAll(
          ".quiz-option"
        );


      options.forEach(
        function (option) {

          option.classList.remove(
            "selected"
          );

        }
      );


      if (options[oIndex]) {

        options[oIndex]
          .classList.add(
            "selected"
          );


        qBlock.dataset.selectedIndex =
          oIndex;

      }

    }


    /* =====================================================
       CHECK QUIZ
    ====================================================== */

    function checkQuizAnswers() {

      if (
        !latestQuizData ||
        !Array.isArray(
          latestQuizData
        )
      ) {

        alert(
          "No quiz data available."
        );

        return;

      }


      let score = 0;

      const total =
        latestQuizData.length;


      latestQuizData.forEach(
        function (
          q,
          qIndex
        ) {

          const qBlock =
            document.getElementById(
              `q-block-${qIndex}`
            );


          if (!qBlock) {
            return;
          }


          const selectedIdx =
            qBlock.dataset.selectedIndex;


          const options =
            qBlock.querySelectorAll(
              ".quiz-option"
            );


          const expBox =
            document.getElementById(
              `exp-${qIndex}`
            );


          const correctIdx =
            typeof q.answer === "number"
              ? q.answer
              : 0;


          /* Reset */

          options.forEach(
            function (option) {

              option.classList.remove(
                "selected",
                "correct",
                "incorrect"
              );

            }
          );


          /* Check answer */

          if (
            selectedIdx !==
            undefined
          ) {

            const selectedNum =
              parseInt(
                selectedIdx,
                10
              );


            if (
              selectedNum ===
              correctIdx
            ) {

              if (
                options[selectedNum]
              ) {

                options[selectedNum]
                  .classList.add(
                    "correct"
                  );

              }

              score++;

            } else {

              if (
                options[selectedNum]
              ) {

                options[selectedNum]
                  .classList.add(
                    "incorrect"
                  );

              }


              if (
                options[correctIdx]
              ) {

                options[correctIdx]
                  .classList.add(
                    "correct"
                  );

              }

            }

          } else {

            if (
              options[correctIdx]
            ) {

              options[correctIdx]
                .classList.add(
                  "correct"
                );

            }

          }


          /* Explanation */

          if (expBox) {

            expBox.style.display =
              "block";

          }

        }
      );


      alert(
        `Quiz Complete! You scored ${score} out of ${total}`
      );

    }


    /* =====================================================
       AUTO FOCUS
    ====================================================== */

    window.addEventListener(
      "load",
      function () {

        const input =
          document.getElementById(
            "promptInput"
          );


        if (input) {
          input.focus();
        }

      }
    );

  </script>

</body>
</html>
